[project]
name = "inshust"
version = "0.1.0"
description = "Instagram group-chat bot that dedupes repeated reel/post shares and replies to the original message"
readme = "README.md"
authors = [
    { name = "Jaccxc", email = "s06263971@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "instagrapi>=2.16.10",
    "python-dotenv>=1.2.2",
]

[project.scripts]
inshust = "inshust:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
